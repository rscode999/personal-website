<!doctype html>
html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // This script takes the current URL and redirects it to the index.html page 
      // with the query string preserved so React Router can process it.
      var pathSegmentsToKeep = 1; // Adjust if your repo is nested deeper
      var l = window.location;
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;
      
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body></body>
</html>
